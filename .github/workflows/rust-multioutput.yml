name: Original Rust native multi-output observation
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  installed-multioutput:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      RAVELINK_OBSERVER_DIAGNOSTICS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.91.1 --profile minimal
      - name: Build original dual-cable driver, two-output runtime client and independent observer
        run: |
          mkdir -p build/rust-multioutput-system
          sh drivers/macos/build-bundle.sh > build/rust-multioutput-system/build-driver.log 2>&1
          cargo build -p ravelink-audio --release --example runtime-multioutput-probe --locked > build/rust-multioutput-system/build-runtime.log 2>&1
          xcrun clang -std=c11 -O2 -Wall -Wextra -Werror drivers/macos/tests/system-probe.c -framework CoreAudio -framework CoreFoundation -o build/rust-multioutput-system/system-probe
          shasum -a 256 crates/ravelink-audio/examples/runtime-multioutput-probe.rs target/release/examples/runtime-multioutput-probe drivers/macos/tests/system-probe.c drivers/macos/tests/probe-diagnostics.h drivers/macos/tests/analyze_diagnostics.py drivers/macos/tests/OBSERVER-DIAGNOSTICS.md drivers/macos/tests/run_system.py drivers/macos/tests/run_multioutput.py drivers/macos/tests/analyze_system.py drivers/macos/tests/analyze_runtime.py drivers/macos/tests/analyze_multioutput.py drivers/macos/tests/test_multioutput.py crates/ravelink-audio/MULTI-OUTPUT-ACCEPTANCE.md .github/workflows/rust-multioutput.yml build/rust-multioutput-system/system-probe dist/macos/RaveLink.driver/Contents/MacOS/RaveLinkHAL > build/rust-multioutput-system/build-sha256.txt
          sw_vers > build/rust-multioutput-system/environment.txt
          uname -a >> build/rust-multioutput-system/environment.txt
          xcrun --show-sdk-version >> build/rust-multioutput-system/environment.txt
          rustc -vV >> build/rust-multioutput-system/environment.txt
      - name: Fixed independent analyzer and observer controls without audio
        run: python3 -m unittest discover -s drivers/macos/tests -p 'test_*.py' -v 2>&1 | tee build/rust-multioutput-system/observer-controls.txt
      - name: Fixed runtime protocol controls without audio
        run: cargo test -p ravelink-audio --example runtime-multioutput-probe --locked 2>&1 | tee build/rust-multioutput-system/runtime-controls.txt
      - name: One installed observation of distinct native output buses, route controls and Stop
        run: python3 drivers/macos/tests/run_multioutput.py run
      - name: Ensure owned driver cleanup and both device UIDs absent
        if: always()
        run: python3 drivers/macos/tests/run_multioutput.py cleanup
      - name: Hash original evidence including failed and partial observations
        if: always()
        run: python3 drivers/macos/tests/run_multioutput.py manifest
      - name: Preserve original two-output PCM, native records and failed results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-rust-multioutput-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/rust-multioutput-system/
          if-no-files-found: error
          retention-days: 30

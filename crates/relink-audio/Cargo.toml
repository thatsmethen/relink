[package]
name = "relink-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
arc-swap = "=1.9.3"
cpal = { version = "=0.18.2", default-features = false }
relink-core = { path = "../relink-core" }

[dev-dependencies]
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = { version = "=0.3.2", default-features = false, features = ["std", "AudioHardware", "HostTime", "objc2-core-audio-types", "block2", "dispatch2"] }
objc2-core-audio-types = { version = "=0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFBase", "CFString"] }
block2 = "=0.6.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_Security", "Win32_System_Com", "Win32_System_Performance", "Win32_System_Threading"] }
